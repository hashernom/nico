<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d1c">
    <meta name="color-scheme" content="dark light">
    <title>Nosotros</title>
    <link rel="preload" href="/fonts/cinzel-decorative-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230b0d1c%27/%3E%3Cpath d=%27M16 4l3 9 9 3-9 3-3 9-3-9-9-3 9-3z%27 fill=%27%23f4d786%27/%3E%3C/svg%3E">
</head>
<body class="jardin-body">

    <!-- ============ INTRO: las flores floreciendo ============ -->
    <div class="intro" id="intro">
        <div class="intro-cielo"></div>
        <div class="intro-flores" id="introFlores"></div>
        <div class="intro-tierra"></div>
        <p class="intro-pista" id="introPista">tocá para entrar</p>
    </div>

    <!-- ============ EL JARDÍN ============ -->
    <div class="escena" id="escena" aria-hidden="true">
        <div class="mundo" id="mundo">
            <div class="cielo"></div>
            <div class="colinas"></div>
            <div class="pasto">
                <div class="cantero" id="cantero"></div>
            </div>
        </div>

        <header class="jardin-cabecera">
            <h1 class="jardin-titulo">Nosotros</h1>
            <p class="jardin-sub">tocá un objeto mágico</p>
        </header>
    </div>

    <!-- ============ CONTROLES FLOTANTES ============ -->
    <!-- Esquina libre (la derecha ya tiene sesión + modo oscuro): presencia
         en vivo y la barra de visitas del mes se apilan acá. -->
    <div class="widgets-izquierda" id="widgetsIzquierda"></div>

    <button class="dark-toggle" id="darkToggle" aria-label="Modo oscuro">
        <span class="toggle-icon"><i class="fas fa-sun" aria-hidden="true"></i></span>
    </button>

    <button class="auth-btn" id="authBtn" aria-label="Iniciar sesión"><i class="fas fa-lock"></i></button>

    <div class="auth-modal" id="authModal">
        <div class="auth-caja">
            <button class="auth-cerrar" id="authCerrar" aria-label="Cerrar">&times;</button>
            <h2>Entrar para editar</h2>
            <form id="authForm">
                <label for="authEmail">Email</label>
                <input type="email" id="authEmail" autocomplete="email" required>

                <label for="authPass">Contraseña</label>
                <input type="password" id="authPass" autocomplete="current-password" required>

                <button type="submit">Entrar</button>
            </form>
            <p class="auth-error" id="authError"></p>
        </div>
    </div>

    <!-- ============ PANEL DE MADERA ============ -->
    <div class="panel-capa" id="panelCapa">
        <div class="panel-madera" id="panelMadera" role="dialog" aria-modal="true" aria-labelledby="panelTitulo">
            <div class="panel-cabecera">
                <span class="panel-icono" id="panelIcono" aria-hidden="true"></span>
                <h2 class="panel-titulo" id="panelTitulo"></h2>
                <button class="panel-cerrar" id="panelCerrar" aria-label="Volver al jardín">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="panel-cuerpo" id="panelCuerpo">

                <!-- ---------- TIEMPO: los dos contadores juntos ---------- -->
                <section class="seccion" data-seccion="tiempo" hidden>
                    <h3 class="seccion-sub">Desde que nos conocimos</h3>
                    <div id="timer" class="timer-grid"></div>

                    <h3 class="seccion-sub">De casados</h3>
                    <div class="timer-pausado">
                        <span class="timer-pausado-candado" aria-hidden="true"><i class="fas fa-lock"></i></span>
                        <div id="timer2" class="timer-grid"></div>
                    </div>
                </section>

                <!-- ---------- GALERÍA ---------- -->
                <section class="seccion" data-seccion="galeria" hidden>
                    <div class="galeria-orden" id="galeriaOrden" role="group" aria-label="Ordenar fotos">
                        <button type="button" class="galeria-orden-btn activo" data-orden="album">Álbum</button>
                        <button type="button" class="galeria-orden-btn" data-orden="nuevas">Más nuevas</button>
                        <button type="button" class="galeria-orden-btn" data-orden="viejas">Más viejas</button>
                    </div>

                    <div class="photo-album" id="gallery-grid"></div>

                    <form class="form-coop oculto" id="fotoForm">
                        <input type="file" id="fotoArchivo" accept="image/*" aria-label="Elegir foto" required>
                        <input type="text" id="fotoCaption" placeholder="Descripción..." maxlength="140">
                        <input type="date" id="fotoFecha" aria-label="Fecha de la foto">
                        <button type="submit">Subir</button>
                        <p class="form-estado" id="fotoEstado"></p>
                    </form>
                </section>

                <!-- ---------- EVENTOS ---------- -->
                <section class="seccion" data-seccion="eventos" hidden>
                    <div class="timeline-container">
                        <div class="timeline-line"></div>
                        <div id="checkpoints-list"></div>
                    </div>

                    <form class="form-coop oculto" id="eventoForm">
                        <input type="text" id="eventoTitulo" placeholder="Nuevo evento..." maxlength="120" required>
                        <input type="date" id="eventoFecha" aria-label="Fecha del evento">
                        <button type="submit">Agregar</button>
                    </form>
                </section>

                <!-- ---------- TO-DO ---------- -->
                <section class="seccion" data-seccion="todos" hidden>
                    <div id="todoPanel" class="todo-en-panel">
                        <div class="todo-input-group">
                            <input type="text" id="todoInput" placeholder="Nueva tarea..." maxlength="100">
                            <button id="todoAddBtn" aria-label="Agregar tarea"><i class="fas fa-plus"></i></button>
                        </div>
                        <ul id="todoList" class="todo-list"></ul>
                        <div class="todo-footer">
                            <span id="todoCount">0 items</span>
                            <button id="todoClearDone">Limpiar <i class="fas fa-eraser"></i></button>
                        </div>
                    </div>
                </section>

                <!-- ---------- CARTAS ---------- -->
                <section class="seccion" data-seccion="cartas" hidden>
                    <div class="sobres" id="cartasLista"></div>

                    <form class="form-coop oculto" id="cartaForm">
                        <input type="date" id="cartaFecha" aria-label="Fecha de la carta">
                        <textarea id="cartaTexto" placeholder="Escribile algo..." maxlength="2000" rows="4" required></textarea>
                        <button type="submit">Guardar carta</button>
                        <p class="form-estado" id="cartaEstado"></p>
                    </form>
                </section>

                <!-- ---------- MÚSICA ---------- -->
                <section class="seccion" data-seccion="musica" hidden>
                    <div class="cassettes" id="musicaLista"></div>

                    <form class="form-coop oculto" id="cancionForm">
                        <input type="text" id="cancionTitulo" placeholder="Título..." maxlength="120" required>
                        <input type="url" id="cancionUrl" placeholder="https://..." maxlength="500">
                        <input type="text" id="cancionNota" placeholder="Por qué esta..." maxlength="200">
                        <button type="submit">Agregar</button>
                        <p class="form-estado" id="cancionEstado"></p>
                    </form>
                </section>

            </div>
        </div>
    </div>

    <!-- ============ LIGHTBOX ============ -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev"><i class="fas fa-chevron-left"></i></button>
        <button class="lightbox-nav lightbox-next" id="lightboxNext"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox-content">
            <div class="lightbox-frame">
                <img id="lightboxImg" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
            </div>
            <div class="lightbox-caption" id="lightboxCaption"></div>
            <div class="lightbox-counter" id="lightboxCounter"></div>
        </div>
    </div>

    <script type="module" src="/src/jardin.js"></script>
</body>
</html>
